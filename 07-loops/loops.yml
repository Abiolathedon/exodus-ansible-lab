---
# ================================================================
# CONCEPT 07 - LOOPS
# A loop repeats ONE task once for EACH item in a list.
# The current item is available as the special variable 'item'.
# ================================================================

# [START OF PLAY 1] - a simple loop over a list of text values.
- name: Play 1 - basic loop
  # [KEYWORD] hosts -> platform-01 only, to keep output small.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK] print a message once per list item.
    - name: Print each fruit
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> {{ item }} is the CURRENT list item on each pass.
        msg: "Current fruit is {{ item }}"
      # [KEYWORD] loop -> the list to repeat the task over.
      #           The task runs once for EACH value here.
      loop:
        - apple
        - banana
        - cherry


# [START OF PLAY 2] - loop over a list held in a VARIABLE.
# More realistic: the list is data (a variable), not hardcoded in the task.
- name: Play 2 - loop over a variable
  # [KEYWORD] hosts -> platform-01 only.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off.
  gather_facts: false

  # [KEYWORD] vars -> define the list ONCE as data.
  vars:
    # a list variable (same shape as lists you made in Concept 06)
    fleet_services:
      - sshd
      - chronyd
      - firewalld

  # [KEYWORD] tasks
  tasks:
    # [TASK] loop over the VARIABLE instead of a hardcoded list.
    - name: Print each service name from the variable
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> {{ item }} is the current service each pass.
        msg: "Service to check: {{ item }}"
      # [KEYWORD] loop -> point at the VARIABLE (wrapped in {{ }}).
      #           The task runs once per item in fleet_services.
      loop: "{{ fleet_services }}"



# [START OF PLAY 3] - loop over a list of DICTIONARIES (structured items).
# Each item is not a single value, but a record with several fields.
- name: Play 3 - loop over dictionaries
  # [KEYWORD] hosts -> platform-01 only.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off.
  gather_facts: false

  # [KEYWORD] vars
  vars:
    # a list where EACH item is a dictionary (has 'name' and 'port').
    services_info:
      # item 1: a dictionary with two fields
      - name: prometheus
        port: 9090
      # item 2
      - name: grafana
        port: 3000
      # item 3
      - name: opensearch
        port: 9200

  # [KEYWORD] tasks
  tasks:
    # [TASK] loop over the dictionaries; access each field by its key.
    - name: Print each service and its port
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> item.name and item.port pull the FIELDS
        #             out of the current dictionary each pass.
        msg: "Service {{ item.name }} listens on port {{ item.port }}"
      # [KEYWORD] loop -> the list of dictionaries.
      loop: "{{ services_info }}"     



# [START OF PLAY 4] - loop + register: capture EACH iteration's result.
- name: Play 4 - loop with register
  # [KEYWORD] hosts -> platform-01 only.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off.
  gather_facts: false

  # [KEYWORD] vars
  vars:
    # a list of small read-only commands to run.
    commands_to_run:
      - whoami
      - hostname
      - pwd

  # [KEYWORD] tasks
  tasks:
    # [TASK 1] run each command in the list, capturing every result.
    - name: Run each read-only command
      # [MODULE] ansible.builtin.command -> runs the current command.
      ansible.builtin.command: "{{ item }}"
      # [KEYWORD] loop -> run the task once per command.
      loop: "{{ commands_to_run }}"
      # [KEYWORD] register -> capture ALL iterations into 'command_output'.
      #           Because this loops, results land in command_output.results
      register: command_output
      # [KEYWORD] changed_when -> these are read-only -> report 'ok'.
      changed_when: false

    # [TASK 2] loop over the CAPTURED results and print each one.
    - name: Show each command's output
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> item.item = which command; item.stdout = its output.
        msg: "'{{ item.item }}' returned: {{ item.stdout }}"
      # [KEYWORD] loop -> loop over the .results list captured above.
      loop: "{{ command_output.results }}"
      # [KEYWORD] loop_control -> options that control how the loop DISPLAYS.
      loop_control:
        # [PARAMETER] label -> in the (item=...) line, show ONLY this short
        #             value (the command), not the whole result object.
        label: "{{ item.item }}"

