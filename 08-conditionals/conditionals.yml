---
# ================================================================
# CONCEPT 08 - CONDITIONALS
# 'when:' runs a task ONLY IF a condition is true.
# If false, the task is SKIPPED (you'll see 'skipping:').
# ================================================================

# [START OF PLAY 1] - conditional based on GROUP MEMBERSHIP (real use).
- name: Play 1 - run a task only on hosts in a specific group
  # SAFE (learning): target the whole linux group so we can SEE which
  # hosts match the condition and which get skipped.
  hosts: linux
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: all
  # hosts: monitoring
  # hosts: exodus-platform-01

  # [KEYWORD] gather_facts -> off; group_names doesn't need facts.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK] runs ONLY on hosts that are in the 'monitoring' group.
    - name: Announce monitoring role
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a MONITORING node"
      # [KEYWORD] when -> condition: is this host in the monitoring group?
      #           'group_names' is a built-in list of groups the host belongs to.
      when: "'monitoring' in group_names"

    # [TASK] runs ONLY on hosts that are in the 'logging' group.
    - name: Announce logging role
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a LOGGING node"
      # [KEYWORD] when -> condition: is this host in the logging group?
      when: "'logging' in group_names"



# [START OF PLAY 2] - conditional based on the host's OPERATING SYSTEM (fact).
- name: Play 2 - run different tasks depending on the OS
  # SAFE (learning): the whole linux group (all our nodes are RHEL,
  # so the RHEL task runs and the Ubuntu task skips everywhere).
  hosts: linux
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: all
  # hosts: exodus-platform-01

  # [KEYWORD] gather_facts -> TRUE this time. We NEED facts because the
  #           condition below tests 'ansible_distribution' (the OS name),
  #           which only exists if facts are gathered.
  gather_facts: true

  # [KEYWORD] tasks
  tasks:
    # [TASK] runs ONLY on Red Hat / RHEL hosts.
    - name: Task for RHEL-family hosts
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is RHEL ({{ ansible_distribution }} {{ ansible_distribution_major_version }}) - would use dnf"
      # [KEYWORD] when -> condition: is the OS Red Hat family?
      #           'ansible_distribution' is a FACT (the OS name, e.g. 'RedHat').
      when: ansible_distribution == "RedHat"

    # [TASK] runs ONLY on Ubuntu hosts (none in our fleet -> will skip).
    - name: Task for Ubuntu hosts
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is Ubuntu - would use apt"
      # [KEYWORD] when -> condition: is the OS Ubuntu?
      when: ansible_distribution == "Ubuntu"

  
# [START OF PLAY 3] - combine conditions with 'and' / 'or'.
- name: Play 3 - multiple conditions
  # SAFE (learning): the whole linux group so we can see the mix.
  hosts: linux
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: all
  # hosts: exodus-platform-01

  # [KEYWORD] gather_facts -> TRUE; we test the OS fact below.
  gather_facts: true

  # [KEYWORD] tasks
  tasks:
    # [TASK] runs ONLY if BOTH are true: RHEL  AND  in monitoring group.
    - name: RHEL AND monitoring
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a RHEL monitoring node (both conditions true)"
      # [KEYWORD] when -> a LIST of conditions = ALL must be true (implicit AND).
      when:
        - ansible_distribution == "RedHat"
        - "'monitoring' in group_names"

    # [TASK] runs if EITHER is true: monitoring OR logging node.
    - name: monitoring OR logging
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a monitoring OR logging node"
      # [KEYWORD] when -> use 'or' inside ONE expression for either-true.
      when: "'monitoring' in group_names or 'logging' in group_names"



# [START OF PLAY 4] - check something, then act on the RESULT.
- name: Play 4 - conditional based on a registered result
  # SAFE (learning): platform-01 only, to keep output small.
  hosts: exodus-platform-01
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: linux
  # hosts: all

  # [KEYWORD] gather_facts -> off; we don't need facts here.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK 1] CHECK: is the 'sshd' service present? (read-only check)
    - name: Check if sshd is installed
      # [MODULE] ansible.builtin.command -> run a read-only check.
      #          'systemctl status sshd' returns rc=0 if it exists/runs.
      ansible.builtin.command: systemctl status sshd
      # [KEYWORD] register -> capture the result into 'sshd_check'.
      register: sshd_check
      # [KEYWORD] changed_when -> a check changes nothing -> report 'ok'.
      changed_when: false
      # [KEYWORD] ignore_errors -> if sshd were missing, rc would be non-zero
      #           and the task would fail; ignore it so we can react instead.
      ignore_errors: true

    # [TASK 2] ACT: only announce "healthy" IF the check succeeded (rc == 0).
    - name: Report sshd is healthy
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "sshd is present and the check passed (rc={{ sshd_check.rc }})"
      # [KEYWORD] when -> test a FIELD of the registered result.
      #           .rc is the return code; 0 means the check succeeded.
      when: sshd_check.rc == 0

    # [TASK 3] ACT: only warn IF the check FAILED (rc != 0).
    - name: Warn sshd check failed
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "sshd check did NOT pass - would investigate"
      # [KEYWORD] when -> '!=' means "not equal". Runs only if rc is NOT 0.
      when: sshd_check.rc != 0