---
# ================================================================
# CONCEPT 08 - CONDITIONALS
# 'when:' runs a task ONLY IF a condition is true.
# If false, the task is SKIPPED (you'll see 'skipping:').
# ================================================================

# [START OF PLAY 1] - conditional based on GROUP MEMBERSHIP (real use).
- name: Play 1 - run a task only on hosts in a specific group
  # SAFE (learning): target the whole linux group so we can SEE which
  # hosts match the condition and which get skipped.
  hosts: linux
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: all
  # hosts: monitoring
  # hosts: exodus-platform-01

  # [KEYWORD] gather_facts -> off; group_names doesn't need facts.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK] runs ONLY on hosts that are in the 'monitoring' group.
    - name: Announce monitoring role
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a MONITORING node"
      # [KEYWORD] when -> condition: is this host in the monitoring group?
      #           'group_names' is a built-in list of groups the host belongs to.
      when: "'monitoring' in group_names"

    # [TASK] runs ONLY on hosts that are in the 'logging' group.
    - name: Announce logging role
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is a LOGGING node"
      # [KEYWORD] when -> condition: is this host in the logging group?
      when: "'logging' in group_names"



# [START OF PLAY 2] - conditional based on the host's OPERATING SYSTEM (fact).
- name: Play 2 - run different tasks depending on the OS
  # SAFE (learning): the whole linux group (all our nodes are RHEL,
  # so the RHEL task runs and the Ubuntu task skips everywhere).
  hosts: linux
  # FLEET-WIDE / other targets (real use - uncomment when you mean it):
  # hosts: all
  # hosts: exodus-platform-01

  # [KEYWORD] gather_facts -> TRUE this time. We NEED facts because the
  #           condition below tests 'ansible_distribution' (the OS name),
  #           which only exists if facts are gathered.
  gather_facts: true

  # [KEYWORD] tasks
  tasks:
    # [TASK] runs ONLY on Red Hat / RHEL hosts.
    - name: Task for RHEL-family hosts
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is RHEL ({{ ansible_distribution }} {{ ansible_distribution_major_version }}) - would use dnf"
      # [KEYWORD] when -> condition: is the OS Red Hat family?
      #           'ansible_distribution' is a FACT (the OS name, e.g. 'RedHat').
      when: ansible_distribution == "RedHat"

    # [TASK] runs ONLY on Ubuntu hosts (none in our fleet -> will skip).
    - name: Task for Ubuntu hosts
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is Ubuntu - would use apt"
      # [KEYWORD] when -> condition: is the OS Ubuntu?
      when: ansible_distribution == "Ubuntu"