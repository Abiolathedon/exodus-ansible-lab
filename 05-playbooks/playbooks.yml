---
# ================================================================
# PLAYBOOK: a file containing one or more PLAYS, run top to bottom.
# This first play targets the whole linux group (read-only).
# ================================================================

# [START OF PLAY 1] - a play = hosts + settings + tasks
- name: Play 1 - basic checks on all linux hosts
  # [KEYWORD] hosts -> which hosts this play runs on (the 'linux' group).
  hosts: linux
  # [KEYWORD] gather_facts -> whether to auto-collect host facts first.
  #           'false' keeps it fast; we'll turn it on when we need facts.
  gather_facts: false

  # [KEYWORD] tasks -> the ordered list of tasks for THIS play.
  tasks:
    # [TASK] calls one module.
    - name: Confirm connectivity
      # [MODULE] ansible.builtin.ping -> checks Ansible can reach + run.
      ansible.builtin.ping:


# [START OF PLAY 2] - a SECOND play in the same file, different target.
# Playbooks run plays top to bottom: Play 1 finishes, then Play 2 runs.
- name: Play 2 - checks on the monitoring group only
  # [KEYWORD] hosts -> this play targets a DIFFERENT group: 'monitoring'.
  #           (from your inventory - the observability/grafana nodes.)
  hosts: monitoring
  # [KEYWORD] gather_facts -> off again for speed.
  gather_facts: false

  # [KEYWORD] tasks -> this play's own separate task list.
  tasks:
    # [TASK]
    - name: Say which play and group this is
      # [MODULE] ansible.builtin.debug -> prints a message.
      ansible.builtin.debug:
        # [PARAMETER] msg -> the text to print.
        msg: "This is Play 2, running only on the monitoring group"

