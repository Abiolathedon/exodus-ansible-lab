---
# ================================================================
# PLAYBOOK: a file containing one or more PLAYS, run top to bottom.
# This first play targets the whole linux group (read-only).
# ================================================================

# [START OF PLAY 1] - a play = hosts + settings + tasks
- name: Play 1 - basic checks on all linux hosts
  # [KEYWORD] hosts -> which hosts this play runs on (the 'linux' group).
  hosts: linux
  # [KEYWORD] gather_facts -> whether to auto-collect host facts first.
  #           'false' keeps it fast; we'll turn it on when we need facts.
  gather_facts: false

  # [KEYWORD] tasks -> the ordered list of tasks for THIS play.
  tasks:
    # [TASK] calls one module.
    - name: Confirm connectivity
      # [MODULE] ansible.builtin.ping -> checks Ansible can reach + run.
      ansible.builtin.ping:


# [START OF PLAY 2] - a SECOND play in the same file, different target.
# Playbooks run plays top to bottom: Play 1 finishes, then Play 2 runs.
- name: Play 2 - checks on the monitoring group only
  # [KEYWORD] hosts -> this play targets a DIFFERENT group: 'monitoring'.
  #           (from your inventory - the observability/grafana nodes.)
  hosts: monitoring
  # [KEYWORD] gather_facts -> off again for speed.
  gather_facts: false

  # [KEYWORD] tasks -> this play's own separate task list.
  tasks:
    # [TASK]
    - name: Say which play and group this is
      # [MODULE] ansible.builtin.debug -> prints a message.
      ansible.builtin.debug:
        # [PARAMETER] msg -> the text to print.
        msg: "This is Play 2, running only on the monitoring group"



# [START OF PLAY 3] - demonstrate privilege escalation with 'become'.
- name: Play 3 - prove root access with become (read-only)
  # [KEYWORD] hosts -> run on platform-01 only, to keep output small.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off for speed.
  gather_facts: false
  # [KEYWORD] become -> escalate privileges for this play's tasks.
  #           'true' means: run tasks as root (via sudo, per ansible.cfg).
  become: true

  # [KEYWORD] tasks
  tasks:
    # [TASK] read a root-only file to PROVE we are root.
    - name: Read the first line of /etc/shadow (root-only file)
      # [MODULE] ansible.builtin.command -> runs a program.
      #          'head -n 1 /etc/shadow' reads only the first line.
      #          This file is readable ONLY by root - so success proves
      #          escalation worked. It reads, changes nothing.
      ansible.builtin.command: head -n 1 /etc/shadow
      # [KEYWORD] register -> capture the result to show it next.
      register: shadow_line
      # [KEYWORD] changed_when -> reading changes nothing -> report 'ok'.
      changed_when: false

    # [TASK] confirm we could read it (proves root worked).
    - name: Confirm root access worked
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> we show only that it worked + who we ran as,
        #             NOT the sensitive content itself.
        msg: "Root read succeeded on {{ inventory_hostname }} - become is working"
      

# [START OF PLAY 4] - demonstrate a host targeting PATTERN.
- name: Play 4 - union pattern (monitoring OR logging)
  # [KEYWORD] hosts -> a PATTERN, not just one group.
  #           'monitoring:logging' = the UNION: hosts in EITHER group.
  #           ':' between groups means OR (combine them).
  hosts: monitoring:logging
  # [KEYWORD] gather_facts -> off for speed.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK] name each host this pattern selected, to SEE the result.
    - name: Show that this host was selected by the pattern
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> print the host's inventory name.
        msg: "Selected by monitoring:logging -> {{ inventory_hostname }}"



        