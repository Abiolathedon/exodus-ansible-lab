---
# ================================================================
# CONCEPT 06 - VARIABLES
# A variable = a named container holding a value you can reuse.
# ================================================================

# [START OF PLAY 1] - define variables at the PLAY level with 'vars'.
- name: Play 1 - play-level variables
  # [KEYWORD] hosts -> run on platform-01 only, to keep output small.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off; we don't need host facts here.
  gather_facts: false

  # [KEYWORD] vars -> define variables for THIS play.
  #           Each is a name: value pair.
  vars:
    # a text (string) variable
    app_name: "EXODUS Portal"
    # a number variable
    app_port: 8080
    # a true/false (boolean) variable
    app_enabled: true

  # [KEYWORD] tasks
  tasks:
    # [TASK] use the variables by wrapping their names in {{ }}.
    - name: Show the variable values
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> {{ name }} inserts a variable's value.
        msg: "{{ app_name }} runs on port {{ app_port }} - enabled: {{ app_enabled }}"
        

# [START OF PLAY 2] - load variables from a SEPARATE file.
- name: Play 2 - variables from an external file
  # [KEYWORD] hosts -> platform-01 only, small output.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] vars_files -> load variables from external file(s).
  #           This pulls in everything defined in app_vars.yml.
  vars_files:
    - app_vars.yml

  # [KEYWORD] tasks
  tasks:
    # [TASK] use the values that came from the file.
    - name: Show database settings from the file
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> variables loaded from app_vars.yml.
        msg: "DB {{ db_name }} at {{ db_host }}:{{ db_port }}"

    # [TASK] show the whole list variable.
    - name: Show the allowed environments list
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] var -> dump a whole variable (here, the list).
        var: allowed_environments

    # [TASK] pick ONE item out of the list by its position.
    - name: Show just the first environment
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> list items are numbered from 0.
        #             [0] = first item, [1] = second, etc.
        msg: "First environment is {{ allowed_environments[0] }}"



# [START OF PLAY 3] - use group_vars WITHOUT loading them manually.
# Note: there is NO 'vars:' and NO 'vars_files:' here.
# Ansible auto-loads group_vars/monitoring.yml because this play
# targets the 'monitoring' group and the filename matches.
- name: Play 3 - automatic group_vars for the monitoring group
  # [KEYWORD] hosts -> the 'monitoring' group (observability + grafana).
  #           This membership is what triggers the auto-load.
  hosts: monitoring
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] tasks  (notice: no vars section at all!)
  tasks:
    # [TASK] use variables that arrived AUTOMATICALLY from group_vars.
    - name: Show the auto-loaded group variables
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> these came from group_vars/monitoring.yml
        #             with no vars_files line - purely by group name.
        msg: "{{ inventory_hostname }} | role: {{ monitoring_role }} | prometheus:{{ prometheus_port }} grafana:{{ grafana_port }}"



# [START OF PLAY 4] - a DIFFERENT group, its OWN auto-loaded cupboard.
# Again: no vars, no vars_files. Targeting 'logging' auto-loads
# group_vars/logging.yml (different group -> different values).
- name: Play 4 - automatic group_vars for the logging group
  # [KEYWORD] hosts -> the 'logging' group (logging-01).
  hosts: logging
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] tasks  (again: no vars section)
  tasks:
    # [TASK] use variables auto-loaded from group_vars/logging.yml.
    - name: Show the auto-loaded logging variables
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> these came from the 'logging' cupboard.
        msg: "{{ inventory_hostname }} | role: {{ logging_role }} | opensearch:{{ opensearch_port }} | keep logs {{ log_retention_days }} days"



# [START OF PLAY 5] - the 'all' cupboard reaches EVERY host.
# No vars, no vars_files. Targeting 'all' auto-loads group_vars/all.yml
# for every server in the inventory.
- name: Play 5 - fleet-wide variables from group_vars/all.yml
  # [KEYWORD] hosts -> 'all' = every host in the inventory.
  hosts: all
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] tasks
  tasks:
    # [TASK] show the fleet-wide values on every node.
    - name: Show the fleet-wide variables
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> these came from the 'all' cupboard,
        #             so EVERY host should print them.
        msg: "{{ inventory_hostname }} | {{ company_name }} | {{ environment_tier }} | contact {{ admin_contact }}"



# [START OF PLAY 6] - use host_vars for ONE specific host.
# No vars, no vars_files. Targeting exodus-platform-01 auto-loads
# host_vars/exodus-platform-01.yml (that host's personal locker).
- name: Play 6 - automatic host_vars for platform-01
  # [KEYWORD] hosts -> just this one host by name.
  hosts: exodus-platform-01
  # [KEYWORD] gather_facts -> off; not needed.
  gather_facts: false

  # [KEYWORD] tasks  (again: no vars section)
  tasks:
    # [TASK] use variables auto-loaded from this host's locker.
    - name: Show the auto-loaded host variables
      # [MODULE] ansible.builtin.debug
      ansible.builtin.debug:
        # [PARAMETER] msg -> these came from host_vars/exodus-platform-01.yml
        #             purely because the filename matches the host name.
        msg: "{{ inventory_hostname }} | {{ server_purpose }} | rank: {{ node_rank }} | window: {{ maintenance_window }}"

        