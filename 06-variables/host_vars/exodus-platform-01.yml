---
# ================================================================
# host_vars/exodus-platform-01.yml
# The PERSONAL LOCKER for ONE host: exodus-platform-01.
# Auto-applied to that host ONLY. The filename matches the host name.
# No load line needed - convention does it, exactly like group_vars.
# ================================================================

# a value unique to this one server
server_purpose: "Core platform services node"

# this host's specific role in the fleet
node_rank: "primary-core"

# a per-host setting nobody else should have
maintenance_window: "Sunday 02:00-04:00"  



# --- PRECEDENCE DEMO ---
# This SAME variable name also exists in group_vars/all.yml
# (there it is "production-lab", applying to EVERY host).
# Here we set it for platform-01 ONLY. host_vars beats group_vars/all,
# so THIS value should win on platform-01.
environment_tier: "platform-01-SPECIAL"  