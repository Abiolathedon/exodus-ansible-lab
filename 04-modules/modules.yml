---
# a play = which hosts to run on + the list of tasks to run
- name: Module examples (read-only)
  # run against the whole linux group from the inventory
  hosts: linux
  # do NOT gather facts automatically yet (keeps output clean for now)
  gather_facts: false

  tasks:
    # TASK 1: the ping module
    # 'name' is a human-readable label shown in the output.
    - name: Example 1 - ping the hosts
      # 'ansible.builtin.ping' is the MODULE being called.
      # ping does NOT ping like ICMP - it checks Ansible can log in over
      # SSH and run Python on the target. It changes nothing.
      ansible.builtin.ping:

    # TASK 2: the debug module
    # 'debug' prints a message to your screen during the run.
    # It is how you SEE things while a playbook runs. It changes nothing.
    - name: Example 2 - print a simple message
      ansible.builtin.debug:
        # 'msg' is the text to print. It can be any message you choose.
        msg: "Hello from EXODUS - this is the debug module"


    # TASK 3: the setup module (gather facts)
    # 'setup' is the MODULE that collects facts about a host:
    # its OS, IP addresses, memory, CPU, disks, and much more.
    # It is read-only - it only reads the system, changes nothing.
    - name: Example 3 - gather and show a few facts
      ansible.builtin.setup:
         


    # TASK 4: show specific facts that were gathered above.
    # Example 3 (setup) collected the facts; now 'debug' PRINTS the
    # ones we care about. This shows two modules working together:
    # setup gathers, debug displays.
    - name: Example 4 - show specific gathered facts
      ansible.builtin.debug:
        # 'msg' builds a sentence using facts.
        # {{ ... }} means "insert the value of this fact here".
        # ansible_facts is where setup stores everything it gathered.
        msg: >
          Host {{ ansible_hostname }}
          is running {{ ansible_distribution }}
          {{ ansible_distribution_version }}


    # TASK 5: the service_facts module
    # 'service_facts' discovers every service on the host and whether
    # it is running or stopped. Read-only - it only reads state.
    - name: Example 5 - gather service facts
      ansible.builtin.service_facts:

    # TASK 6: display the FULL list of gathered services first,
    # so we can SEE what actually exists before choosing any by name.
    # 'var' prints a whole variable (here, the services dictionary).
    - name: Example 6 - show all gathered services
      ansible.builtin.debug:
        # 'var' takes the NAME of a variable to dump (no {{ }} needed).
        var: ansible_facts.services


    # TASK 7: show ONE specific service that exists on EVERY node.
    # We verified via the full fleet inventory that sshd runs on all 7
    # nodes, so referencing it by name is safe fleet-wide.
    # (The node-exporter naming differs on 2 nodes - a real finding
    #  logged to fix later under change management, not here.)
    - name: Example 7 - show whether sshd is running
      ansible.builtin.debug:
        msg: >
          sshd on {{ ansible_hostname }}
          is {{ ansible_facts.services['sshd.service'].state }}


    
    # TASK 8: the package_facts module
    # 'package_facts' discovers every software PACKAGE installed on the
    # host (name + version). Read-only - it only reads, changes nothing.
    - name: Example 8 - gather package facts
      ansible.builtin.package_facts:

    # TASK 9: show whether ONE known package is installed, and its version.
    # package_facts stores results in ansible_facts.packages, keyed by
    # package name. We check 'openssh-server' (present on every node -
    # it provides sshd, which we already proved runs everywhere).
    - name: Example 9 - show openssh-server package version
      ansible.builtin.debug:
        # .0.version = the version of the first (usually only) copy installed.
        msg: >
          openssh-server on {{ ansible_hostname }}
          is version {{ ansible_facts.packages['openssh-server'].0.version }}



    # ============================================================
    # TASK 10 - run a read-only command and capture its output
    # PATTERN: 'command' GETS the data -> 'register' CARRIES it ->
    #          'debug' (next task) SHOWS it. Two tasks working together.
    # ============================================================
    - name: Example 10 - run uptime (read-only)
      # [MODULE] ansible.builtin.command -> runs a program on the host.
      # Here it runs 'uptime' (read-only: shows how long the host is up).
      ansible.builtin.command: uptime
      # [KEYWORD] register -> saves THIS task's result into a variable
      #           we name 'uptime_result', so a later task can use it.
      register: uptime_result
      # [KEYWORD] changed_when -> tells Ansible whether this task "changed"
      #           anything. 'false' = it changed nothing -> reports 'ok'.
      #           (command marks itself 'changed' by default, so we correct it.)
      changed_when: false

    # ============================================================
    # TASK 11 - display what Task 10 captured
    # ============================================================
    - name: Example 11 - show the uptime output
      # [MODULE] ansible.builtin.debug -> prints things to the screen.
      ansible.builtin.debug:
        # [PARAMETER] msg -> the text to print. Here we print the
        #             '.stdout' field of the variable we registered.
        msg: "{{ uptime_result.stdout }}"  